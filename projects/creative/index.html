<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛事预测查询 - Sport Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .api-config {
            background: rgba(255, 255, 255, 0.95);
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .api-config input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .api-config label {
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 0.5rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #667eea;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
        }

        .match-item {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .match-item:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .match-teams {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .match-league {
            color: #666;
            font-size: 0.9rem;
        }

        .match-time {
            color: #999;
            font-size: 0.85rem;
        }

        .prediction-info {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .prediction-item {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
            padding: 0.5rem;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .prediction-label {
            font-weight: 600;
            color: #667eea;
        }

        .prediction-value {
            color: #333;
        }

        .confidence {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .confidence-high {
            background: #d4edda;
            color: #155724;
        }

        .confidence-medium {
            background: #fff3cd;
            color: #856404;
        }

        .confidence-low {
            background: #f8d7da;
            color: #721c24;
        }

        .recommendation-section {
            margin-top: 1.5rem;
        }

        .recommendation-type {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .recommendation-matches {
            margin-top: 1rem;
        }

        .score-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .score-option {
            background: #f8f9fa;
            padding: 0.75rem;
            border-radius: 5px;
            text-align: center;
            border: 2px solid #ddd;
        }

        .score-option.high {
            border-color: #28a745;
            background: #d4edda;
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: white;
            color: #667eea;
            transform: translateY(-3px);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ 赛事预测查询系统</h1>
            <p>基于大语言模型的足球比赛预测分析</p>
        </div>

        <div class="api-config">
            <label for="apiUrl">API 服务器地址：</label>
            <input type="text" id="apiUrl" value="http://localhost:3001" placeholder="http://localhost:3001">
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="loadTodayMatches()">📅 获取今日比赛</button>
            <button class="btn btn-success" onclick="predictToday()">🔮 预测今日比赛</button>
            <button class="btn btn-info" onclick="loadTodayPredictions()">📊 查看今日预测</button>
            <button class="btn btn-warning" onclick="generateRecommendations()">⭐ 生成推荐</button>
            <button class="btn btn-info" onclick="loadRecommendations()">💡 查看推荐</button>
            <button class="btn btn-primary" onclick="compareResults()">📊 对比预测</button>
            <button class="btn btn-primary" onclick="compareRecommendations()">⭐ 对比推荐</button>
            <button class="btn btn-info" onclick="loadHistoryRecommendations()">📜 历史推荐</button>
        </div>

        <div class="content">
            <div class="card">
                <h2>📅 今日比赛</h2>
                <div id="matchesContainer">
                    <div class="empty-state">
                        <div class="empty-state-icon">⚽</div>
                        <p>点击"获取今日比赛"查看比赛列表</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>🔮 预测结果</h2>
                <div id="predictionsContainer">
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <p>点击"查看今日预测"查看预测结果</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top: 2rem;">
            <h2>💡 推荐结果</h2>
            <div id="recommendationsContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">⭐</div>
                    <p>点击"查看推荐"查看推荐结果</p>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top: 2rem;">
            <h2>📜 历史推荐</h2>
            <div style="margin-bottom: 1rem; display: flex; gap: 1rem; align-items: center;">
                <select id="historyTypeFilter" onchange="loadHistoryRecommendations()" style="flex: 1; padding: 0.75rem; border: 2px solid #ddd; border-radius: 5px; font-size: 1rem; cursor: pointer;">
                    <option value="">全部推荐类型</option>
                    <option value="goalRecommendation">进球数推荐</option>
                    <option value="halfFullTimeRecommendation">半全场推荐</option>
                    <option value="scoreRecommendation">比分推荐</option>
                    <option value="comboRecommendation">二串一组合推荐</option>
                </select>
                <button class="btn btn-info" onclick="loadHistoryRecommendations()" style="padding: 0.75rem 1.5rem;">刷新数据</button>
            </div>
            <div id="historyStatisticsContainer"></div>
            <div id="historyRecommendationsContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">📜</div>
                    <p>点击"历史推荐"按钮加载历史数据</p>
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="../../index.html" class="back-link">← 返回主页</a>
        </div>
    </div>

    <script>
        const API_BASE = () => document.getElementById('apiUrl').value || 'http://localhost:3001';

        async function apiCall(endpoint, method = 'GET', body = null) {
            try {
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                    }
                };
                if (body) {
                    options.body = JSON.stringify(body);
                }
                const response = await fetch(`${API_BASE()}${endpoint}`, options);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('API Error:', error);
                return { success: false, error: error.message };
            }
        }

        function showLoading(containerId) {
            document.getElementById(containerId).innerHTML = '<div class="loading">⏳ 加载中...</div>';
        }

        function showError(containerId, message) {
            document.getElementById(containerId).innerHTML = `<div class="error">❌ 错误：${message}</div>`;
        }

        async function loadTodayMatches() {
            showLoading('matchesContainer');
            const result = await apiCall('/api/predictions/matches/today');
            
            if (!result.success) {
                showError('matchesContainer', result.error || '获取比赛失败');
                return;
            }

            const matches = result.data || [];
            if (matches.length === 0) {
                document.getElementById('matchesContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📅</div><p>今日暂无比赛</p></div>';
                return;
            }

            const html = matches.map(match => `
                <div class="match-item">
                    <div class="match-header">
                        <div>
                            <div class="match-teams">${match.homeTeam} vs ${match.awayTeam}</div>
                            <div class="match-league">${match.league || '未知联赛'}</div>
                        </div>
                        <div class="match-time">${match.matchTime || ''}</div>
                    </div>
                    <div style="margin-top: 0.5rem; color: #666; font-size: 0.9rem;">
                        比赛ID: ${match.matchId}
                    </div>
                </div>
            `).join('');

            document.getElementById('matchesContainer').innerHTML = html;
        }

        async function predictToday() {
            if (!confirm('确定要预测今日所有比赛吗？这可能需要一些时间。')) {
                return;
            }

            showLoading('predictionsContainer');
            const result = await apiCall('/api/predictions/predict/today', 'POST');
            
            if (!result.success) {
                showError('predictionsContainer', result.error || '预测失败');
                return;
            }

            alert(`预测完成！成功预测 ${result.successCount || 0} 场比赛`);
            loadTodayPredictions();
        }

        async function loadTodayPredictions() {
            showLoading('predictionsContainer');
            const result = await apiCall('/api/predictions/today');
            
            if (!result.success) {
                showError('predictionsContainer', result.error || '获取预测失败');
                return;
            }

            const predictions = result.data || [];
            if (predictions.length === 0) {
                document.getElementById('predictionsContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><p>今日暂无预测结果</p></div>';
                return;
            }

            const html = predictions.map(pred => {
                const predData = pred.prediction?.prediction || {};
                const confidence = parseInt(predData.confidence) || 0;
                const confidenceClass = confidence >= 70 ? 'high' : confidence >= 50 ? 'medium' : 'low';
                
                return `
                    <div class="match-item">
                        <div class="match-header">
                            <div class="match-teams">${pred.homeTeam} vs ${pred.awayTeam}</div>
                            <span class="confidence confidence-${confidenceClass}">${confidence}%</span>
                        </div>
                        <div class="match-league">${pred.league || '未知'}</div>
                        <div class="prediction-info">
                            <div class="prediction-item">
                                <span class="prediction-label">预测结果：</span>
                                <span class="prediction-value">${predData.fullTimeResult || '未知'}</span>
                            </div>
                            <div class="prediction-item">
                                <span class="prediction-label">预测比分：</span>
                                <span class="prediction-value">${predData.score || '未知'}</span>
                            </div>
                            <div class="prediction-item">
                                <span class="prediction-label">总进球数：</span>
                                <span class="prediction-value">${predData.goalRange || '未知'}</span>
                            </div>
                            <div class="prediction-item">
                                <span class="prediction-label">半全场：</span>
                                <span class="prediction-value">${predData.halfFullTime || '未知'}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('predictionsContainer').innerHTML = html;
        }

        async function generateRecommendations() {
            if (!confirm('确定要生成今日推荐吗？这可能需要一些时间。')) {
                return;
            }

            showLoading('recommendationsContainer');
            const result = await apiCall('/api/predictions/recommendations/generate', 'POST');
            
            if (!result.success) {
                showError('recommendationsContainer', result.error || '生成推荐失败');
                return;
            }

            alert('推荐生成成功！');
            loadRecommendations();
        }

        async function loadRecommendations() {
            showLoading('recommendationsContainer');
            const result = await apiCall('/api/predictions/recommendations/today');
            
            if (!result.success) {
                showError('recommendationsContainer', result.error || '获取推荐失败');
                return;
            }

            const rec = result.data?.recommendation;
            if (!rec) {
                document.getElementById('recommendationsContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⭐</div><p>今日暂无推荐结果</p></div>';
                return;
            }

            let html = '';

            // 进球数推荐
            if (rec.goalRecommendation) {
                const goal = rec.goalRecommendation;
                html += `
                    <div class="recommendation-section">
                        <div class="recommendation-type">${goal.type || '进球数推荐'}</div>
                        <p>${goal.description || ''}</p>
                        ${goal.matches ? goal.matches.map(m => `
                            <div class="match-item">
                                <div class="match-teams">${m.homeTeam} vs ${m.awayTeam}</div>
                                <div class="prediction-item">
                                    <span class="prediction-label">进球数：</span>
                                    <span class="prediction-value">${m.goalRange || ''}</span>
                                </div>
                                <div class="prediction-item">
                                    <span class="prediction-label">信心度：</span>
                                    <span class="prediction-value">${m.confidence || ''}%</span>
                                </div>
                            </div>
                        `).join('') : ''}
                    </div>
                `;
            }

            // 半全场推荐
            if (rec.halfFullTimeRecommendation) {
                const hft = rec.halfFullTimeRecommendation;
                html += `
                    <div class="recommendation-section">
                        <div class="recommendation-type">${hft.type || '半全场推荐'}</div>
                        <p>${hft.description || ''}</p>
                        ${hft.matches ? hft.matches.map(m => `
                            <div class="match-item">
                                <div class="match-teams">${m.homeTeam} vs ${m.awayTeam}</div>
                                <div class="prediction-item">
                                    <span class="prediction-label">半全场：</span>
                                    <span class="prediction-value">${m.halfFullTime || ''}</span>
                                </div>
                                <div class="prediction-item">
                                    <span class="prediction-label">信心度：</span>
                                    <span class="prediction-value">${m.confidence || ''}%</span>
                                </div>
                            </div>
                        `).join('') : ''}
                    </div>
                `;
            }

            // 比分推荐
            if (rec.scoreRecommendation) {
                const score = rec.scoreRecommendation;
                html += `
                    <div class="recommendation-section">
                        <div class="recommendation-type">${score.type || '比分推荐'}</div>
                        <p>${score.description || ''}</p>
                        ${score.matches ? score.matches.map(m => `
                            <div class="match-item">
                                <div class="match-teams">${m.homeTeam} vs ${m.awayTeam}</div>
                                ${m.scoreOptions ? `
                                    <div class="score-options">
                                        ${m.scoreOptions.map((opt, idx) => `
                                            <div class="score-option ${idx === 0 ? 'high' : ''}">
                                                <div style="font-weight: 600; font-size: 1.1rem;">${opt.score}</div>
                                                <div style="font-size: 0.85rem; color: #666; margin-top: 0.25rem;">${opt.confidence}%</div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : `
                                    <div class="prediction-item">
                                        <span class="prediction-label">比分：</span>
                                        <span class="prediction-value">${m.score || ''}</span>
                                    </div>
                                `}
                            </div>
                        `).join('') : ''}
                    </div>
                `;
            }

            // 二串一组合推荐
            if (rec.comboRecommendation) {
                const combo = rec.comboRecommendation;
                html += `
                    <div class="recommendation-section">
                        <div class="recommendation-type">${combo.type || '二串一组合推荐'} - ${combo.comboType || ''}</div>
                        <p>${combo.description || ''}</p>
                        <div style="background: #f0f0f0; padding: 1rem; border-radius: 5px; margin: 1rem 0;">
                            <strong>组合：</strong> ${combo.combination || ''}
                        </div>
                        ${combo.matches ? combo.matches.map(m => `
                            <div class="match-item">
                                <div class="match-teams">${m.homeTeam} vs ${m.awayTeam}</div>
                                <div class="prediction-item">
                                    <span class="prediction-label">预测：</span>
                                    <span class="prediction-value">${m.prediction || ''}</span>
                                </div>
                                <div class="prediction-item">
                                    <span class="prediction-label">信心度：</span>
                                    <span class="prediction-value">${m.confidence || ''}%</span>
                                </div>
                            </div>
                        `).join('') : ''}
                    </div>
                `;
            }

            // 总结
            if (rec.summary) {
                html += `
                    <div class="recommendation-section" style="margin-top: 2rem; padding-top: 2rem; border-top: 2px solid #ddd;">
                        <h3 style="color: #667eea; margin-bottom: 1rem;">📋 推荐总结</h3>
                        <p><strong>最佳推荐：</strong>${rec.summary.bestRecommendation || ''}</p>
                        <p style="margin-top: 0.5rem;"><strong>推荐理由：</strong>${rec.summary.whyBest || ''}</p>
                        <p style="margin-top: 0.5rem;"><strong>风险提示：</strong>${rec.summary.riskWarning || ''}</p>
                    </div>
                `;
            }

            document.getElementById('recommendationsContainer').innerHTML = html || '<div class="empty-state"><p>暂无推荐数据</p></div>';
        }

        async function compareResults() {
            const date = prompt('请输入要对比的日期 (YYYY-MM-DD)', new Date().toISOString().split('T')[0]);
            if (!date) return;

            showLoading('predictionsContainer');
            const result = await apiCall(`/api/predictions/compare?date=${date}`);
            
            if (!result.success) {
                showError('predictionsContainer', result.error || '对比失败');
                return;
            }

            const data = result.data;
            const comparisons = data.comparisonResults || [];
            const stats = data.statistics || {};

            if (comparisons.length === 0) {
                document.getElementById('predictionsContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><p>暂无对比数据</p></div>';
                return;
            }

            // 统计信息
            let html = `
                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1.5rem; border-radius: 10px; margin-bottom: 1.5rem;">
                    <h3 style="margin-bottom: 1rem; font-size: 1.3rem;">📊 对比统计 (${date})</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem;">
                        <div>
                            <div style="font-size: 0.9rem; opacity: 0.9;">总比赛数</div>
                            <div style="font-size: 1.5rem; font-weight: 600;">${stats.totalMatches || 0}</div>
                        </div>
                        <div>
                            <div style="font-size: 0.9rem; opacity: 0.9;">有结果比赛</div>
                            <div style="font-size: 1.5rem; font-weight: 600;">${stats.matchesWithResults || 0}</div>
                        </div>
                        <div>
                            <div style="font-size: 0.9rem; opacity: 0.9;">胜负正确</div>
                            <div style="font-size: 1.5rem; font-weight: 600;">${stats.fullTimeResultCorrect || 0}</div>
                        </div>
                        <div>
                            <div style="font-size: 0.9rem; opacity: 0.9;">比分正确</div>
                            <div style="font-size: 1.5rem; font-weight: 600;">${stats.scoreCorrect || 0}</div>
                        </div>
                        <div>
                            <div style="font-size: 0.9rem; opacity: 0.9;">进球数正确</div>
                            <div style="font-size: 1.5rem; font-weight: 600;">${stats.goalRangeCorrect || 0}</div>
                        </div>

                : '/api/predictions/recommendations/history';
            
            showLoading('historyRecommendationsContainer');

                if (!result.success) {
                    showError('historyRecommendationsContainer', result.error || '获取历史推荐失败');
                    return;
                }

                const data = result.data || [];
                const statistics = result.statistics || {};

                // 显示统计信息
                displayHistoryStatistics(statistics);

                // 显示历史推荐列表
                if (data.length === 0) {

                html += `
                    <div class="recommendation-section">
                        <div class="recommendation-type">${hft.type || '半全场推荐'}</div>
                        <p>${hft.description || ''}</p>
                        ${hft.matches ? hft.matches.map(m => `
                            <div class="match-item">
                                <div class="match-teams">${m.homeTeam} vs ${m.awayTeam}</div>
                                <div class="match-league">${m.league || '未知'}</div>
                                <div class="prediction-item">
                                    <span class="prediction-label">半全场：</span>
                                    <span class="prediction-value">${m.halfFullTime || ''}</span>
                                </div>
                                <div class="prediction-item">
                                    <span class="prediction-label">信心度：</span>
                                    <span class="prediction-value">${m.confidence || ''}%</span>
                                </div>
                                ${m.reason ? `<div style="margin-top: 0.5rem; padding: 0.5rem; background: #f8f9fa; border-radius: 5px; font-size: 0.9rem; color: #666;">${m.reason}</div>` : ''}
                            </div>
                        `).join('') : ''}
                    </div>
                `;
            }

            // 比分推荐
            if (rec.scoreRecommendation) {
                const score = rec.scoreRecommendation;
                html += `
                    <div class="recommendation-section">
                        <div class="recommendation-type">${score.type || '比分推荐'}</div>
                        <p>${score.description || ''}</p>
                        ${score.matches ? score.matches.map(m => `
                            <div class="match-item">
                                <div class="match-teams">${m.homeTeam} vs ${m.awayTeam}</div>
                                <div class="match-league">${m.league || '未知'}</div>
                                ${m.scoreOptions ? `
                                    <div style="margin-top: 0.5rem;">
                                        <div style="font-weight: 600; color: #667eea; margin-bottom: 0.5rem;">推荐比分（3个选项）：</div>
                                        <div class="score-options">
                                            ${m.scoreOptions.map((opt, idx) => `
                                                <div class="score-option ${idx === 0 ? 'high' : ''}">
                                                    <div style="font-weight: 600; font-size: 1.1rem;">${opt.score}</div>
                                                    <div style="font-size: 0.85rem; color: #666; margin-top: 0.25rem;">${opt.confidence}%</div>
                                                    ${opt.reason ? `<div style="font-size: 0.75rem; color: #999; margin-top: 0.25rem;">${opt.reason}</div>` : ''}
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : `
                                    <div class="prediction-item">
                                        <span class="prediction-label">比分：</span>
                                        <span class="prediction-value">${m.score || ''}</span>
                                    </div>
                                `}
                            </div>
                        `).join('') : ''}
                    </div>
                `;
            }

            // 二串一组合推荐
            if (rec.comboRecommendation) {
                const combo = rec.comboRecommendation;
                html += `
                    <div class="recommendation-section">
                        <div class="recommendation-type">${combo.type || '二串一组合推荐'} - ${combo.comboType || ''}</div>
                        <p>${combo.description || ''}</p>
                        <div style="background: #f0f0f0; padding: 1rem; border-radius: 5px; margin: 1rem 0;">
                            <strong>组合：</strong> ${combo.combination || ''}
                        </div>
                        ${combo.matches ? combo.matches.map(m => `
                            <div class="match-item">
                                <div class="match-teams">${m.homeTeam} vs ${m.awayTeam}</div>
                                <div class="match-league">${m.league || '未知'}</div>
                                <div class="prediction-item">
                                    <span class="prediction-label">预测：</span>
                                    <span class="prediction-value">${m.prediction || ''}</span>
                                </div>
                                <div class="prediction-item">
                                    <span class="prediction-label">信心度：</span>
                                    <span class="prediction-value">${m.confidence || ''}%</span>
                                </div>
                                ${m.reason ? `<div style="margin-top: 0.5rem; padding: 0.5rem; background: #f8f9fa; border-radius: 5px; font-size: 0.9rem; color: #666;">${m.reason}</div>` : ''}
                            </div>
                        `).join('') : ''}
                    </div>
                `;
            }

            // 总结
            if (rec.summary) {
                html += `
                    <div class="recommendation-section" style="margin-top: 2rem; padding-top: 2rem; border-top: 2px solid #ddd;">
                        <h3 style="color: #667eea; margin-bottom: 1rem;">📋 推荐总结</h3>
                        <p><strong>最佳推荐：</strong>${rec.summary.bestRecommendation || ''}</p>
                        <p style="margin-top: 0.5rem;"><strong>推荐理由：</strong>${rec.summary.whyBest || ''}</p>
                        ${rec.summary.overallAnalysis ? `<p style="margin-top: 0.5rem;"><strong>整体分析：</strong>${rec.summary.overallAnalysis}</p>` : ''}
                        <p style="margin-top: 0.5rem;"><strong>风险提示：</strong>${rec.summary.riskWarning || ''}</p>
                    </div>
                `;
            }

            document.getElementById('historyRecommendationsContainer').innerHTML = html || '<div class="empty-state"><p>暂无推荐数据</p></div>';
        }

        // 页面加载时自动获取今日比赛
        window.addEventListener('load', () => {
            loadTodayMatches();
        });
    </script>
</body>
</html>
