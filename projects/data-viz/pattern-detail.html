<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">模式详情 - 英语积累系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-link:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding-top: 60px;
        }

        .content-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .pattern-formula {
            font-family: 'Courier New', monospace;
            background: #f0f4ff;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.5rem;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 30px;
            border: 2px dashed #667eea;
            text-align: center;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: #667eea;
            border-radius: 2px;
        }

        .function-text {
            color: #555;
            line-height: 1.8;
            font-size: 1.1rem;
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
        }

        .examples-list {
            list-style: none;
        }

        .example-item {
            background: #f9fafb;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 4px solid #10b981;
            color: #555;
            line-height: 1.6;
            position: relative;
        }

        .example-item::before {
            content: '"';
            position: absolute;
            left: -2px;
            top: -10px;
            font-size: 3rem;
            color: #10b981;
            opacity: 0.2;
        }

        .example-number {
            display: inline-block;
            background: #10b981;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 0.85rem;
            margin-right: 10px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .content-card {
                padding: 25px;
            }

            .pattern-formula {
                font-size: 1.2rem;
                padding: 15px;
            }

            .section-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <a href="#" class="back-link" id="backLink">← 返回列表</a>
    
    <div class="container">
        <div class="content-card">
            <div class="pattern-formula" id="patternFormula"></div>

            <div class="section">
                <h2 class="section-title">功能说明</h2>
                <div class="function-text" id="patternFunction"></div>
            </div>

            <div class="section">
                <h2 class="section-title">例句</h2>
                <ul class="examples-list" id="examplesList"></ul>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        // 从 URL 获取参数
        const urlParams = new URLSearchParams(window.location.search);
        const modeId = urlParams.get('mode') || 'mode1';
        const patternIndex = parseInt(urlParams.get('pattern') || '0');

        // 设置返回链接
        document.getElementById('backLink').href = `mode-list.html?mode=${modeId}`;

        // 加载数据
        const modeData = modesData[modeId];
        if (modeData && modeData.patterns[patternIndex]) {
            const pattern = modeData.patterns[patternIndex];

            document.getElementById('pageTitle').textContent = `${pattern.formula} - ${modeData.title}`;
            document.getElementById('patternFormula').textContent = pattern.formula;
            document.getElementById('patternFunction').textContent = pattern.function;

            const examplesList = document.getElementById('examplesList');

            // 从 formula 中提取关键词（去除 S+V, N 等占位符）
            const formulaKeywords = pattern.formula
                .replace(/S\+V\.?/g, '')
                .replace(/\[.*?\]/g, '')
                .replace(/N\.?/g, '')
                .split(/[,\s]+/)
                .filter(word => word.length > 2 && /^[A-Za-z]+$/.test(word));

            pattern.examples.forEach((example, index) => {
                const li = document.createElement('li');
                li.className = 'example-item';

                let formattedExample = example;

                // 将 formula 中的关键词在例句中加粗
                formulaKeywords.forEach(keyword => {
                    const regex = new RegExp(`\\b(${keyword})\\b`, 'gi');
                    formattedExample = formattedExample.replace(regex, '<strong>$1</strong>');
                });

                li.innerHTML = `<span class="example-number">${index + 1}</span>${formattedExample}`;
                examplesList.appendChild(li);
            });
        }
    </script>
</body>
</html>
