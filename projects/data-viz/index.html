<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN-Model系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-home:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding-top: 40px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            animation: fadeInUp 0.8s ease-out;
        }

        .modes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .mode-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .mode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .mode-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .mode-icon {
            font-size: 2.5rem;
        }

        .mode-title {
            flex: 1;
        }

        .mode-number {
            font-size: 0.9rem;
            color: #667eea;
            font-weight: 700;
        }

        .mode-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            margin-top: 5px;
        }

        .mode-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .pattern-count {
            display: inline-block;
            padding: 5px 12px;
            background: #f0f4ff;
            color: #667eea;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .modes-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-home">← 返回主页</a>

    <div class="container">
        <div class="header">
            <h1>📚 英语积累系统</h1>
            <p class="subtitle">五种核心模式，系统化提升英语表达能力</p>
        </div>

        <div class="modes-grid">
            <!-- 模式 I: 逻辑与过渡模式 -->
            <a href="mode-list.html?mode=mode1" class="mode-card">
                <div class="mode-header">
                    <div class="mode-icon">🔗</div>
                    <div class="mode-title">
                        <div class="mode-number">模式 I</div>
                        <div class="mode-name">逻辑与过渡模式</div>
                    </div>
                </div>
                <div class="mode-description">
                    用于连接句子、段落，表达逻辑关系和思维转折的表达模式
                </div>
                <span class="pattern-count">5 个常用模式</span>
            </a>

            <!-- 模式 II: 观点与让步模式 -->
            <a href="mode-list.html?mode=mode2" class="mode-card">
                <div class="mode-header">
                    <div class="mode-icon">💭</div>
                    <div class="mode-title">
                        <div class="mode-number">模式 II</div>
                        <div class="mode-name">观点与让步模式</div>
                    </div>
                </div>
                <div class="mode-description">
                    表达观点、承认对立面、进行让步和反驳的表达模式
                </div>
                <span class="pattern-count">4 个常用模式</span>
            </a>

            <!-- 模式 III: 核心句法框架 -->
            <a href="mode-list.html?mode=mode3" class="mode-card">
                <div class="mode-header">
                    <div class="mode-icon">🏗️</div>
                    <div class="mode-title">
                        <div class="mode-number">模式 III</div>
                        <div class="mode-name">核心句法框架</div>
                    </div>
                </div>
                <div class="mode-description">
                    常用的句式结构和语法框架，构建复杂句子的基础
                </div>
                <span class="pattern-count">6 个常用模式</span>
            </a>

            <!-- 模式 IV: 动词/名词搭配模式 -->
            <a href="mode-list.html?mode=mode4" class="mode-card">
                <div class="mode-header">
                    <div class="mode-icon">🔤</div>
                    <div class="mode-title">
                        <div class="mode-number">模式 IV</div>
                        <div class="mode-name">动词/名词搭配模式</div>
                    </div>
                </div>
                <div class="mode-description">
                    高频词汇搭配和固定短语，提升表达的地道性
                </div>
                <span class="pattern-count">8 个常用模式</span>
            </a>

            <!-- 模式 V: 实用功能性模式 -->
            <a href="mode-list.html?mode=mode5" class="mode-card">
                <div class="mode-header">
                    <div class="mode-icon">⚡</div>
                    <div class="mode-title">
                        <div class="mode-number">模式 V</div>
                        <div class="mode-name">实用功能性模式</div>
                    </div>
                </div>
                <div class="mode-description">
                    日常交流和学术写作中的实用表达和功能性短语
                </div>
                <span class="pattern-count">5 个常用模式</span>
            </a>
        </div>
    </div>


</body>
</html>
