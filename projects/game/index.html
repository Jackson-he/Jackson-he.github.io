<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票推荐话术检测 - 测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .label-hint {
            font-weight: normal;
            color: #999;
            font-size: 12px;
            margin-left: 5px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .threshold-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .threshold-value {
            font-weight: 600;
            color: #667eea;
            min-width: 40px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.success {
            background: #f0f9ff;
            border: 2px solid #3b82f6;
        }

        .result.warning {
            background: #fef3c7;
            border: 2px solid #f59e0b;
        }

        .result.error {
            background: #fee2e2;
            border: 2px solid #ef4444;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
        }

        .result-icon {
            font-size: 24px;
        }

        .result-details {
            display: grid;
            gap: 10px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #666;
        }

        .result-value {
            font-weight: 600;
        }

        .batch-results {
            display: grid;
            gap: 15px;
            margin-top: 15px;
        }

        .batch-item {
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .batch-item.warning {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }

        .batch-item-text {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .batch-item-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .batch-summary {
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .batch-summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .batch-summary-item {
            text-align: center;
        }

        .batch-summary-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .batch-summary-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .examples {
            margin-top: 20px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .examples h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .example-item {
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .example-item:hover {
            background: #667eea;
            color: white;
        }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-home:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-home">← 返回主页</a>
    <div class="container">
        <div class="header">
            <h1>🔍 内容合规检测</h1>
            <p>基于 AI 模型的智能检测系统</p>
        </div>

        <div class="content">
            <!-- 标签页切换 -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('single')">单条检测</button>
                <button class="tab" onclick="switchTab('batch')">批量检测</button>
            </div>

            <!-- 单条检测 -->
            <div id="singleTab" class="tab-content active">
                <div class="form-group">
                    <label for="textInput">输入待检测文本：</label>
                    <textarea id="textInput" rows="4" placeholder="例如：这只股票一定能让你翻倍！"></textarea>
                </div>

                <div class="form-group">
                    <label>检测阈值：</label>
                    <div class="threshold-group">
                        <input type="range" id="threshold" min="0" max="1" step="0.1" value="0.5">
                        <span class="threshold-value" id="thresholdValue">0.5</span>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="detectText()">🔍 开始检测</button>
                    <button class="btn-secondary" onclick="clearResult()">🗑️ 清空</button>
                </div>

                <div class="examples">
                    <h3>📝 示例文本（点击快速填充）：</h3>
                    <div class="example-item" onclick="fillExample('这只股票一定能让你翻倍！')">
                        这只股票一定能让你翻倍！
                    </div>
                    <div class="example-item" onclick="fillExample('我推荐你买这只股票')">
                        我推荐你买这只股票
                    </div>
                    <div class="example-item" onclick="fillExample('股市有风险，投资需谨慎')">
                        股市有风险，投资需谨慎
                    </div>
                    <div class="example-item" onclick="fillExample('建议你重点关注这几只股票')">
                        建议你重点关注这几只股票
                    </div>
                </div>
            </div>

            <!-- 批量检测 -->
            <div id="batchTab" class="tab-content">
                <div class="form-group">
                    <label for="batchTextInput">
                        输入待检测文本：
                        <span class="label-hint">（每行一条，最多100条）</span>
                    </label>
                    <textarea id="batchTextInput" rows="10" placeholder="这只股票一定能让你翻倍！&#10;我推荐你买这只股票&#10;股市有风险，投资需谨慎&#10;建议你重点关注这几只股票"></textarea>
                </div>

                <div class="form-group">
                    <label>检测阈值：</label>
                    <div class="threshold-group">
                        <input type="range" id="batchThreshold" min="0" max="1" step="0.1" value="0.5">
                        <span class="threshold-value" id="batchThresholdValue">0.5</span>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="detectBatch()">🔍 批量检测</button>
                    <button class="btn-secondary" onclick="clearBatchResult()">🗑️ 清空</button>
                </div>

                <div class="examples">
                    <h3>📝 示例文本（点击快速填充）：</h3>
                    <div class="example-item" onclick="fillBatchExample()">
                        填充示例文本（6条）
                    </div>
                </div>
            </div>

            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://47.109.195.13/api/detect';
        const BATCH_API_URL = 'http://47.109.195.13/api/detect/batch';

        // 标签页切换
        function switchTab(tab) {
            // 更新标签按钮状态
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // 更新内容显示
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (tab === 'single') {
                document.getElementById('singleTab').classList.add('active');
            } else {
                document.getElementById('batchTab').classList.add('active');
            }

            // 清空结果
            document.getElementById('result').classList.remove('show');
        }

        // 更新阈值显示
        document.getElementById('threshold').addEventListener('input', function(e) {
            document.getElementById('thresholdValue').textContent = e.target.value;
        });

        document.getElementById('batchThreshold').addEventListener('input', function(e) {
            document.getElementById('batchThresholdValue').textContent = e.target.value;
        });

        // 填充示例
        function fillExample(text) {
            document.getElementById('textInput').value = text;
        }

        function fillBatchExample() {
            const examples = [
                '这只股票一定能让你翻倍！',
                '我推荐你买这只股票',
                '股市有风险，投资需谨慎',
                '建议你重点关注这几只股票',
                '今天天气不错',
                '这只股票值得关注'
            ];
            document.getElementById('batchTextInput').value = examples.join('\n');
        }

        // 清空结果
        function clearResult() {
            document.getElementById('textInput').value = '';
            document.getElementById('result').classList.remove('show');
        }

        function clearBatchResult() {
            document.getElementById('batchTextInput').value = '';
            document.getElementById('result').classList.remove('show');
        }

        // 检测单条文本
        async function detectText() {
            const text = document.getElementById('textInput').value.trim();
            const threshold = parseFloat(document.getElementById('threshold').value);
            const resultDiv = document.getElementById('result');

            if (!text) {
                alert('请输入待检测的文本！');
                return;
            }

            // 显示加载状态
            resultDiv.className = 'result show';
            resultDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>正在检测中...</div>
                </div>
            `;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text, threshold })
                });

                const result = await response.json();

                if (result.success) {
                    displayResult(result.data);
                } else {
                    displayError(result.error);
                }
            } catch (error) {
                displayError('无法连接到 API 服务，请确保服务已启动！');
            }
        }

        // 批量检测
        async function detectBatch() {
            const batchText = document.getElementById('batchTextInput').value.trim();
            const threshold = parseFloat(document.getElementById('batchThreshold').value);
            const resultDiv = document.getElementById('result');

            if (!batchText) {
                alert('请输入待检测的文本！');
                return;
            }

            // 分割文本为数组
            const texts = batchText.split('\n')
                .map(t => t.trim())
                .filter(t => t.length > 0);

            if (texts.length === 0) {
                alert('请输入有效的文本！');
                return;
            }

            if (texts.length > 100) {
                alert('最多支持100条文本，当前有 ' + texts.length + ' 条');
                return;
            }

            // 显示加载状态
            resultDiv.className = 'result show';
            resultDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>正在批量检测 ${texts.length} 条文本...</div>
                </div>
            `;

            try {
                const response = await fetch(BATCH_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ texts, threshold })
                });

                const result = await response.json();

                if (result.success) {
                    displayBatchResult(result.data);
                } else {
                    displayError(result.error);
                }
            } catch (error) {
                displayError('无法连接到 API 服务，请确保服务已启动！');
            }
        }

        // 显示单条检测结果
        function displayResult(data) {
            const resultDiv = document.getElementById('result');
            const hasViolation = data.has_violation;

            // 计算最高违规概率作为整体置信度
            let maxProbability = 0;
            for (const label in data.label_details) {
                const prob = data.label_details[label].probability;
                if (prob > maxProbability) {
                    maxProbability = prob;
                }
            }
            const confidence = (maxProbability * 100).toFixed(2);

            // 构建违规标签列表
            let violationLabelsHtml = '';
            if (hasViolation && data.detected_labels && data.detected_labels.length > 0) {
                violationLabelsHtml = `
                    <div class="result-item">
                        <span class="result-label">违规类型：</span>
                        <span class="result-value">${data.detected_labels.join('、')}</span>
                    </div>
                `;
            }

            // 构建详细概率列表
            let detailsHtml = '';
            if (data.label_details) {
                detailsHtml = '<div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.1);">';
                detailsHtml += '<div style="font-weight: 600; margin-bottom: 10px; color: #666;">详细概率：</div>';
                for (const label in data.label_details) {
                    const details = data.label_details[label];
                    const prob = (details.probability * 100).toFixed(2);
                    const isDetected = details.detected;
                    const icon = isDetected ? '✓' : '✗';
                    const color = isDetected ? '#f59e0b' : '#999';
                    detailsHtml += `
                        <div class="result-item" style="border: none; padding: 5px 0;">
                            <span style="color: ${color};">${icon} ${label}</span>
                            <span style="color: ${color}; font-weight: 600;">${prob}%</span>
                        </div>
                    `;
                }
                detailsHtml += '</div>';
            }

            resultDiv.className = `result show ${hasViolation ? 'warning' : 'success'}`;
            resultDiv.innerHTML = `
                <div class="result-header">
                    <span class="result-icon">${hasViolation ? '⚠️' : '✅'}</span>
                    <span>${hasViolation ? '检测到违规内容' : '内容正常'}</span>
                </div>
                <div class="result-details">
                    <div class="result-item">
                        <span class="result-label">检测文本：</span>
                        <span class="result-value">${escapeHtml(data.text)}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">检测结果：</span>
                        <span class="result-value">${hasViolation ? '违规内容' : '正常内容'}</span>
                    </div>
                    ${violationLabelsHtml}
                    <div class="result-item">
                        <span class="result-label">风险等级：</span>
                        <span class="result-value">${getRiskLevel(maxProbability)}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">置信度：</span>
                        <span class="result-value">${confidence}%</span>
                    </div>
                    <div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${confidence}%"></div>
                        </div>
                    </div>
                    ${detailsHtml}
                </div>
            `;
        }

        // 获取风险等级
        function getRiskLevel(probability) {
            if (probability >= 0.8) return '🔴 高风险';
            if (probability >= 0.6) return '🟠 中风险';
            if (probability >= 0.4) return '🟡 低风险';
            return '🟢 安全';
        }

        // 显示批量检测结果
        function displayBatchResult(data) {
            const resultDiv = document.getElementById('result');
            const summary = data.summary;
            const results = data.results;

            const violationRate = (summary.violation_rate * 100).toFixed(2);

            resultDiv.className = 'result show success';

            let html = `
                <div class="result-header">
                    <span class="result-icon">📊</span>
                    <span>批量检测结果</span>
                </div>

                <div class="batch-summary">
                    <div style="font-weight: 600; margin-bottom: 10px;">统计摘要</div>
                    <div class="batch-summary-grid">
                        <div class="batch-summary-item">
                            <div class="batch-summary-value">${summary.total}</div>
                            <div class="batch-summary-label">总计</div>
                        </div>
                        <div class="batch-summary-item">
                            <div class="batch-summary-value" style="color: #f59e0b;">${summary.violation_count}</div>
                            <div class="batch-summary-label">违规内容</div>
                        </div>
                        <div class="batch-summary-item">
                            <div class="batch-summary-value" style="color: #10b981;">${summary.normal_count}</div>
                            <div class="batch-summary-label">正常内容</div>
                        </div>
                    </div>
                    <div style="text-align: center; margin-top: 10px; color: #666;">
                        违规率: <strong style="color: ${summary.violation_count > 0 ? '#f59e0b' : '#10b981'};">${violationRate}%</strong>
                    </div>
            `;

            // 添加各类型违规统计
            if (summary.label_counts && Object.keys(summary.label_counts).length > 0) {
                html += `
                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.1);">
                        <div style="font-weight: 600; margin-bottom: 8px; color: #666; font-size: 14px;">各类型违规统计：</div>
                `;
                for (const label in summary.label_counts) {
                    const count = summary.label_counts[label];
                    html += `
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px;">
                            <span style="color: #666;">• ${label}</span>
                            <span style="color: #f59e0b; font-weight: 600;">${count} 条</span>
                        </div>
                    `;
                }
                html += `</div>`;
            }

            html += `
                </div>

                <div style="font-weight: 600; margin-bottom: 10px;">详细结果</div>
                <div class="batch-results">
            `;

            results.forEach((item, index) => {
                const hasViolation = item.has_violation;

                // 计算最高违规概率
                let maxProbability = 0;
                for (const label in item.label_details) {
                    const prob = item.label_details[label].probability;
                    if (prob > maxProbability) {
                        maxProbability = prob;
                    }
                }
                const confidence = (maxProbability * 100).toFixed(2);
                const icon = hasViolation ? '⚠️' : '✅';
                const className = hasViolation ? 'warning' : '';
                const riskLevel = getRiskLevel(maxProbability);

                // 构建违规标签
                let violationLabels = '';
                if (hasViolation && item.detected_labels && item.detected_labels.length > 0) {
                    violationLabels = `<div style="font-size: 12px; color: #f59e0b; margin-top: 5px;">
                        违规类型: ${item.detected_labels.join('、')}
                    </div>`;
                }

                html += `
                    <div class="batch-item ${className}">
                        <div class="batch-item-text">
                            <strong>#${index + 1}</strong> ${escapeHtml(item.text)}
                        </div>
                        <div class="batch-item-result">
                            <span>${icon} ${hasViolation ? '违规内容' : '正常内容'} - ${riskLevel}</span>
                            <span style="color: #667eea; font-weight: 600;">置信度: ${confidence}%</span>
                        </div>
                        ${violationLabels}
                        <div class="confidence-bar" style="margin-top: 8px;">
                            <div class="confidence-fill" style="width: ${confidence}%"></div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            resultDiv.innerHTML = html;
        }

        // 显示错误
        function displayError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result show error';
            resultDiv.innerHTML = `
                <div class="result-header">
                    <span class="result-icon">❌</span>
                    <span>检测失败</span>
                </div>
                <div class="result-details">
                    <div class="result-item">
                        <span class="result-label">错误信息：</span>
                        <span class="result-value">${escapeHtml(message)}</span>
                    </div>
                </div>
            `;
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
