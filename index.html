<body>
    <div id="app"></div>
    <script>
        (function restoreGitHubPagesPath() {
            const url = new URL(window.location.href);
            const path = url.searchParams.get('__gh_path__');

            if (!path) {
                return;
            }

            const search = url.searchParams.get('__gh_query__');
            const hash = url.searchParams.get('__gh_hash__');
            const restoredUrl = `${path}${search ? `?${search}` : ''}${hash ? `#${hash}` : ''}`;
            window.history.replaceState(null, '', restoredUrl);
        }());
    </script>
    <script type="module" src="/src/main.js"></script>
